<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account | QuickLink')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar(false, false)}"></nav>
<main class="container py-5 site-main d-flex align-items-center">
    <div class="row justify-content-center w-100">
        <div class="col-sm-10 col-md-8 col-lg-5">
            <section class="card surface-card shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <a class="h3 text-primary text-decoration-none fw-bold" th:href="@{/}">QuickLink</a>
                        <h1 class="h3 mt-3 mb-2">Create your account</h1>
                        <p class="text-secondary mb-0">Start creating secure, trackable short URLs.</p>
                    </div>
                    <div class="alert alert-danger" role="alert" th:if="${#fields.hasErrors('*')}">
                        <p class="mb-0" th:each="error : ${#fields.errors('*')}" th:text="${error}"></p>
                    </div>
                    <form th:action="@{/register}" th:object="${registrationRequest}" method="post" novalidate>
                        <div class="mb-3">
                            <label class="form-label fw-medium" for="name">Name</label>
                            <input class="form-control form-control-lg" th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'" th:field="*{name}" autocomplete="name" required>
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium" for="email">Email address</label>
                            <input class="form-control form-control-lg" th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'" th:field="*{email}" type="email" autocomplete="email" required>
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-medium" for="password">Password</label>
                            <input class="form-control form-control-lg" th:classappend="${#fields.hasErrors('password')} ? ' is-invalid'" th:field="*{password}" type="password" autocomplete="new-password" minlength="8" required>
                            <div class="form-text">Use at least 8 characters.</div>
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                        </div>
                        <button class="btn btn-primary btn-lg w-100" type="submit">Create Account</button>
                    </form>
                    <p class="text-center text-secondary mt-4 mb-0">Already have an account? <a th:href="@{/login}">Login</a></p>
                </div>
            </section>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
