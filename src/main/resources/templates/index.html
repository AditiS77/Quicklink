<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLink</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-8 col-lg-6">

            <div class="text-center mb-4">
                <h1 class="display-5 fw-bold">QuickLink 🚀</h1>
                <p class="text-muted">
                    Shorten long URLs into clean, shareable links
                </p>
                <p>
                    <a th:href="@{/login}">Log in</a>
                    <span>or</span>
                    <a th:href="@{/register}">create an account</a>
                </p>
            </div>

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h4 class="mb-3">Create Short URL</h4>

                    <form th:action="@{/shorten}" method="post">

                        <div class="mb-3">
                            <label for="originalUrl" class="form-label">
                                Original URL
                            </label>
                    
                            <input
                                    type="url"
                                    class="form-control"
                                    id="originalUrl"
                                    name="originalUrl"
                                    placeholder="https://example.com/very/long/url">
                        </div>

                        <div class="mb-3">
                            <label for="expiresAt" class="form-label">
                                Expiration date and time (optional, UTC)
                            </label>

                            <input
                                    type="datetime-local"
                                    class="form-control"
                                    id="expiresAt"
                                    name="expiresAt">
                        </div>

                        <div class="mb-3">
                            <label for="visibility" class="form-label">Visibility</label>
                            <select class="form-select" id="visibility" name="visibility">
                                <option value="PUBLIC">Public</option>
                                <option value="PRIVATE">Private</option>
                            </select>
                        </div>
                    
                        <button
                                type="submit"
                                class="btn btn-primary w-100">
                            Shorten URL
                        </button>
                    
                    </form>
                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
