<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in | QuickLink')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar(false, false)}"></nav>
<main class="container py-5 site-main d-flex align-items-center">
    <div class="row justify-content-center w-100">
        <div class="col-sm-10 col-md-8 col-lg-5">
            <section class="card surface-card shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <a class="h3 text-primary text-decoration-none fw-bold" th:href="@{/}">QuickLink</a>
                        <h1 class="h3 mt-3 mb-2">Welcome back</h1>
                        <p class="text-secondary mb-0">Log in to create and manage your short URLs.</p>
                    </div>
                    <div class="alert alert-danger" role="alert" th:if="${param.error}">Invalid email or password.</div>
                    <div class="alert alert-success" role="alert" th:if="${param.registered}">Your account has been created. Please log in.</div>
                    <div class="alert alert-success" role="alert" th:if="${param.logout}">You have been logged out successfully.</div>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-medium" for="username">Email address</label>
                            <input class="form-control form-control-lg" id="username" name="username" type="email" autocomplete="email" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-medium" for="password">Password</label>
                            <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required>
                        </div>
                        <button class="btn btn-primary btn-lg w-100" type="submit">Login</button>
                    </form>
                    <p class="text-center text-secondary mt-4 mb-0">New to QuickLink? <a th:href="@{/register}">Create an account</a></p>
                </div>
            </section>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
