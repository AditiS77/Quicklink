<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">QuickLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --ql-navy: #1e293b; --ql-blue: #2563eb; --ql-surface: #f8fafc; }
        body { min-height: 100vh; background: var(--ql-surface); color: var(--ql-navy); }
        .navbar-brand { letter-spacing: -.03em; }
        .site-main { min-height: calc(100vh - 138px); }
        .hero { background: linear-gradient(135deg, #eff6ff, #f8fafc 60%, #ecfdf5); border-radius: 1.5rem; }
        .surface-card { border: 0; border-radius: 1rem; }
        .feature-card { transition: transform .2s ease, box-shadow .2s ease; }
        .feature-card:hover { transform: translateY(-4px); box-shadow: 0 .75rem 1.5rem rgba(15, 23, 42, .10); }
        .feature-icon { width: 3rem; height: 3rem; display: grid; place-items: center; border-radius: .85rem; background: #eff6ff; font-size: 1.4rem; }
        .form-control, .form-select { border-radius: .65rem; padding: .65rem .85rem; }
        .form-control:focus, .form-select:focus { border-color: #93c5fd; box-shadow: 0 0 0 .25rem rgba(37, 99, 235, .15); }
        .btn { border-radius: .65rem; font-weight: 600; }
        .table > :not(caption) > * > * { padding: .9rem .75rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top" th:fragment="navbar(authenticated, admin)">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/}">QuickLink</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavigation">
            <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2" th:if="${!authenticated}">
                <a class="nav-link" th:href="@{/login}">Login</a>
                <a class="btn btn-primary px-3" th:href="@{/register}">Create Account</a>
            </div>
            <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2" th:if="${authenticated}">
                <a class="nav-link" th:href="@{/}">Dashboard</a>
                <a class="nav-link" th:href="@{/my-urls}">My URLs</a>
                <a class="nav-link" th:if="${admin}" th:href="@{/admin}">Admin Panel</a>
                <form th:action="@{/logout}" method="post">
                    <button class="btn btn-outline-secondary btn-sm" type="submit">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>
<footer class="border-top bg-white py-4 mt-5" th:fragment="footer">
    <div class="container text-center text-secondary small">© 2026 QuickLink · Secure, shareable links made simple.</div>
</footer>
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</body>
</html>
