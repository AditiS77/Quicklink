<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My URLs | QuickLink')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar(true, false)}"></nav>
<main class="container py-5 site-main">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div><p class="text-primary fw-semibold mb-1">Your workspace</p><h1 class="h2 mb-0">My URLs</h1></div>
        <a class="btn btn-primary" th:href="@{/}">Create Short URL</a>
    </div>
    <section class="card surface-card shadow-sm" th:if="${#lists.isEmpty(shortUrls)}">
        <div class="card-body p-5 text-center"><div class="feature-icon mx-auto mb-3">🔗</div><h2 class="h4">No URLs created yet</h2><p class="text-secondary mb-4">Create your first short URL to begin tracking clicks and sharing links.</p><a class="btn btn-primary" th:href="@{/}">Create your first URL</a></div>
    </section>
    <section class="card surface-card shadow-sm" th:unless="${#lists.isEmpty(shortUrls)}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>Short URL</th><th>Original URL</th><th>Clicks</th><th>Visibility</th><th>Expiration</th><th>Created at</th></tr></thead>
                <tbody>
                <tr th:each="shortUrl : ${shortUrls}">
                    <td><a class="fw-semibold" th:href="@{/{code}(code=${shortUrl.shortCode})}" th:text="${shortUrl.shortCode}" target="_blank" rel="noopener"></a></td>
                    <td class="text-truncate" style="max-width: 18rem;" th:text="${shortUrl.originalUrl}"></td>
                    <td th:text="${shortUrl.clickCount}"></td>
                    <td><span class="badge text-bg-primary" th:text="${shortUrl.visibility}"></span></td>
                    <td th:text="${shortUrl.expiresAt == null ? 'Never' : shortUrl.expiresAt}"></td>
                    <td th:text="${shortUrl.createdAt}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
