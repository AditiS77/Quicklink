<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Link unavailable | QuickLink')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar(false, false)}"></nav>
<main class="container py-5 site-main d-flex align-items-center">
    <div class="row justify-content-center w-100"><div class="col-md-7 col-lg-5"><section class="card surface-card shadow-sm"><div class="card-body p-5 text-center"><div class="feature-icon mx-auto mb-3">🔗</div><h1 class="h3" th:text="${errorMessage == null ? 'Link not found' : 'Expired URL'}">Link not found</h1><p class="text-secondary" th:text="${errorMessage == null ? 'This short link does not exist.' : errorMessage}">This short link does not exist.</p><a class="btn btn-primary" th:href="@{/}">Back to QuickLink</a></div></section></div></div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
