spring.application.name=Quicklink
spring.docker.compose.enabled=false
spring.datasource.url=${QUICKLINK_DB_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${QUICKLINK_DB_USERNAME:myuser}
spring.datasource.password=${QUICKLINK_DB_PASSWORD:secret}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
